name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Test
        run: go test ./...
      - name: Build binary
        run: go build -trimpath -o alster ./cmd/alster
        env:
          CGO_ENABLED: '0'
      - name: Build site
        run: ./alster build -base-url "$ALSTER_BASE_URL"
        env:
          ALSTER_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

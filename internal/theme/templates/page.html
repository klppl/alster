{{template "head" .}}
<main id="main" class="detail page-detail">
  {{with .Page}}
  <header class="detail-header page-header">
    <h1 class="detail-title">{{.Title}}</h1>
    {{if .Description}}<p class="detail-lede">{{.Description}}</p>{{end}}
  </header>
  <article class="prose">
    {{.HTML}}
  </article>
  {{end}}
</main>
{{template "footer" .}}
